name: CI

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches-ignore:
      - master
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        # `npm test` builds dist/ first (pretest), then runs the suite:
        # behavior, CJS/ESM interop matrix, package contract, tarball
        # contents, and the consumer simulation.
        run: npm test

      - name: Type tests
        run: npm run test:types

      - name: Verify package contents
        run: npm pack --dry-run
