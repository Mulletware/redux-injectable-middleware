name: Release

on:
  push:
    branches:
      - master
      - main
  # Allow manual runs from the Actions tab. Useful when a push event is dropped
  # (GitHub occasionally fails to deliver a push webhook) or to re-run against
  # the current HEAD without crafting an empty commit.
  workflow_dispatch:

# contents:write lets semantic-release push the release commit/tag and create
# the GitHub release. We deliberately do NOT grant id-token: write. With it
# present, @semantic-release/npm@13's OIDC branch fires and short-circuits the
# NPM_TOKEN path -- and its OIDC code discards the token, leaving the npmrc
# empty (ENEEDAUTH at publish). Omitting id-token:write forces the plugin
# down the working NPM_TOKEN (granular access token) path.
permissions:
  contents: write

# Never two release runs at once; a queued run re-checks the tags and no-ops
# if the release was already cut.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: semantic-release analyzes commits since the
          # last release tag.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Type tests
        run: npm run test:types

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
